services:
  - type: web
    name: phase-research-terminal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm ci --prefix ui --include=dev && npm run build --prefix ui
    startCommand: python -m uvicorn api:create_demo_app --factory --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /
    envVars:
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: NODE_VERSION
        value: "22.18.0"
